<!DOCTYPE html>
<html>

<head>
    <title>Login</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }

        .login-box {
            background-color: white;
            padding: 30px;
            width: 300px;
            height: 300px;
            border-radius: 15px;
            background-image: url("https://images.wallpapersden.com/image/download/spider-man_amxuaGeUmZqaraWkpJRobWllrWdpZWU.jpg");
            box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19);
        }

        .login-box h2 {
            margin-top: 0;
            text-align: center;
        }

        .input-group {
            margin-bottom: 30px;
            padding: 10px;
            border-radius: 15px;
            font-size: 15px;
        }



        .input-group input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 2px solid #ccc;
            border-radius: 15px;

        }


        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0px 5px 10px rgb(181, 230, 46);
        }

        button:hover {
            background-color: rgb(100, 149, 240);
            box-shadow: 0px 5px 10px rgb(7, 7, 7);
        }
    </style>
</head>

<body>

    <div class="login-box">
        <h2>Login</h2>
        <form>
            <div class="input-group">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="input-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit">Login</button>
        </form>
    </div>

</body>

</html>
