<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bento Box Layout</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f4f0ea;
            padding: 20px;
        }

        .bento-container {
            display: grid;
            grid-template-columns: 1fr 1.2fr 2fr;
            grid-template-rows: 100px 180px 100px;
            gap: 16px;
            padding: 24px;
            border-radius: 36px;
            border: 4px solid #cbd5e1;
            width: 100%;
            max-width: 650px;
        }

        .box {
            border-radius: 24px;
            border: 2px solid #7da9d1;
        }

        .box-top {
            grid-column: 1 / -1;
            grid-row: 1 / 2;
        }

        .box-left-top {
            grid-column: 1 / 2;
            grid-row: 2 / 3;
        }

        .box-left-bottom {
            grid-column: 1 / 2;
            grid-row: 3 / 4;
        }

        .box-middle {
            grid-column: 2 / 3;
            grid-row: 2 / 4;
        }

        .box-right {
            grid-column: 3 / 4;
            grid-row: 2 / 4;
        }

        @media (max-width: 500px) {
            .bento-container {
                grid-template-columns: 1fr 1fr;
                grid-template-rows: auto;
            }

            .box-top {
                grid-column: 1 / -1;
                grid-row: auto;
                min-height: 80px;
            }

            .box-left-top {
                grid-column: 1 / 2;
                grid-row: auto;
                min-height: 120px;
            }

            .box-left-bottom {
                grid-column: 1 / 2;
                grid-row: auto;
                min-height: 80px;
            }

            .box-middle {
                grid-column: 2 / 3;
                grid-row: 2 / 4;
                min-height: 200px;
            }

            .box-right {
                grid-column: 1 / -1;
                grid-row: auto;
                min-height: 150px;
            }
        }
    </style>
</head>

<body>

    <div class="bento-container">
        <div class="box box-top"></div>
        <div class="box box-left-top"></div>
        <div class="box box-left-bottom"></div>
        <div class="box box-middle"></div>
        <div class="box box-right"></div>
    </div>

</body>

</html>
