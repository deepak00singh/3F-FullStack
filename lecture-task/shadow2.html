<html>

<head>
    <title>
        Shadow element
    </title>
    <style>
        img {
            filter: drop-shadow(20px 20px 25px green);
        }

        #zoro {
            filter: drop-shadow(20px 20px 15px red);
        }

        #toggle {
            display: none;
        }

        .img-container .img2 {
            display: none;
        }

        #toggle:checked~.img-container .img1 {
            display: none;
        }

        #toggle:checked~.img-container .img2 {
            display: block;
        }

        .toggle-btn {
            background-color: rgb(19, 102, 87);
            padding: 20px;
            margin: 25px;
            cursor: pointer;
            border-radius: 25px;
            color: black;
            font-size: 20px;
            font-weight: bold;
            border: 5px solid rgb(70, 101, 240);
            filter: drop-shadow(0px 5px 10px rgb(44, 6, 128));
        }

        .toggle-btn:hover {
            background-color: rgb(100, 241, 216);
        }

        .toggle-btn::selection {
            background-color: black;
            color: white;
        }

        button:hover {
            background-color: rgb(55, 199, 70);
        }

        button {
            margin: 25px;
            padding: 15px;
            border-radius: 20px;
            border: 5px solid rgb(8, 8, 8);
            cursor: pointer;
            background-color: green;
            font-size: 20px;
            filter: drop-shadow(0px 5px 10px rgb(44, 6, 128));
        }
    </style>
</head>

<body>
    <input type="checkbox" id="toggle">

    <div class="img-container">
        <img class="img1" src="C:\Users\NITRO V\Downloads\joro-removebg-preview.png" alt="image">

        <img class="img2" id="zoro" src="C:\Users\NITRO V\Downloads\joro-removebg-preview.png" alt="image">
    </div>

    <br>
    <label for="toggle" class="toggle-btn">Change Image</label>
    <button>click me </button>
</body>

</html>
