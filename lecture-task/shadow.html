<html>

<head>
    <title>
        Shadow element
    </title>
    <style>
        .shadow {
            height: 50%;
            width: 50%;
            background-color: #ceb6b6;
            box-shadow: 0px 0px 30px black;
            margin: 25px;
            text-shadow: 5px 5px 5px rgb(0, 0, 0);
            filter: drop-shadow(5px 0 0px blue);

        }

        .container {
            height: 50%;
            width: 50%;
            background-color: #f4f1f1;
            box-shadow: 0px 0px 20px #000000;
            padding: 20px;
            border-radius: 10px;
            box-sizing: border-box;
            position: relative;
            right: -250px;
            top: 100px;
            text-overflow: ellipsis;
            color: aqua;
            font-size: 20px;
            font-family: 'Franklin Gothic Medium';
            text-decoration: underline wavy rgb(93, 228, 221);
            vertical-align: center;
            direction: ltr;



        }
    </style>
</head>

<body>
    <div class="shadow">
        <div class="container">
            <h1>SHADOW BOX</h1>
        </div>
    </div>
</body>

</html>
