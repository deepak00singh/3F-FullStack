<html>

<head>
    <title>pseudo classes</title>
    <style>
        /*
            user interactive an link pseudo classes
            :focus
            :link
            :visited
            :hover
            :active
            */

        /*
            Form input pseudo classes
            :enabled
            :disabled
            :required
            :optional
            :in-range
            :out-of-range
            :read-only
            :read-write
            :checked
            :placeholder-shown
            */
        input:required {
            border-color: rgb(125, 235, 22);
        }

        input {
            border-width: 0px 0px 2px 0px;
            margin: 3%;
            padding: 2%;
        }

        input:optional {
            border-color: blue;
        }

        input:focus {
            border-color: rgb(255, 0, 0);
            box-shadow: 2px 2px 10px rgb(233, 73, 10);
        }

        input:disabled {
            background-color: rgb(211, 211, 211);
            border-width: 0px;
        }

        input:enabled {
            font-family: Helvetica;
        }

        input:in-range {
            font-weight: 900;
        }

        input:out-of-range {
            color: red;
        }

        input:valid {
            color: green;
            border-color: green;
        }

        input:invalid {
            color: red;
            border-color: red;
        }

        input:placeholder-shown {
            font-size: 25px;
        }
    </style>
</head>

<body>
    <form>
        <input type="text" placeholder="First name" required /><br>
        <input type="text" placeholder="middle name" /><br>
        <input type="date" /><br>
        <input type="text" value="mathura" disabled /><br>
        <input id="number" type="number" min="10" max="100" /><br>
        <input type="email" placeholder="enter email" />
        <input type="text" value="GLA" readonly />

    </form>
</body>

</html>
