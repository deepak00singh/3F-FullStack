<html>

<head>
    <title>
        variable
    </title>
    <style>
        :root {
            --primary-color: black;
            --secondary-color: white;
            --text-size: 10px;
        }

        div {
            --primary-color: violet;
        }

        p {
            background-color: var(--primary-color);
            color: var(--secondary-color);
            font-size: calc(var(--text-size)*3);

        }

        .p {
            background-color: aqua;
        }
    </style>

</head>

<body>
    <p>Hello World!!</p>
    <div>
        <p>Hello World!!</p>
        <p>Hello World!!</p>
        <p>Hello World!!</p>
    </div>
    <p>Hello World!!</p>
    <p>Hello World!!</p>
    <p>Hello World!!</p>
    <p class="p">Hello World!!</p>

</body>

</html>
