<html>

<head>
    <title>Bento Box Layout</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        .bento-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 150px);
            gap: 10px;
            padding: 40px;
            margin: 5%;
        }

        .my {
            text-align: center;
            justify-content: center;
            font-size: 60px;
            color: #5ee7df;
        }

        .box {
            border-radius: 15px;
            box-shadow: 0 0 10px #f5576c;
        }

        .box-large {
            grid-column: span 2;
            grid-row: span 2;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .box-side-top {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        .box-side-bottom {
            background: linear-gradient(135deg, #5ee7df 0%, #b4dff8 100%);
        }

        .box-bottom-1 {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .box-bottom-2 {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        .box-bottom-3 {
            background: linear-gradient(135deg, #5ee7df 0%, #b4dff8 100%);
        }
    </style>

</head>

<body>
    <h1 class="my">my photo gallery</h1>
    <div class="bento-container">
        <div class="box box-large"></div>
        <div class="box box-side-top"></div>
        <div class="box box-side-bottom"></div>
        <div class="box box-bottom-1"></div>
        <div class="box box-bottom-2"></div>
        <div class="box box-bottom-3"></div>
    </div>

</body>

</html>
