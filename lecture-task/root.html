<html>

<head>
    <title>root</title>
    <style>
        :root {
            --primary-color: red;
            --text-color: white;
            --btn-width: 100px;
            --btn-height: 70px
        }

        button {
            background-color: var(--primary-color, black);
            color: var(--text-color);
            width: var(--btn-width);
            height: var(--btn-height);
            border-radius: 90px;
            box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.5);
            font-size: 20px;
        }

        .button:hover {
            background-color: blue;
        }

        .button:active {
            background-color: green;
        }
    </style>
</head>

<body>
    <button class="button">click me </button>
</body>

</html>
