<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Analytics Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-[#F1F5F9] text-[#64748B]">
    <div class="flex h-screen overflow-hidden">
        <aside class="hidden md:flex flex-col w-[240px] bg-[#0F172A] text-[#CBD5E1] shrink-0 overflow-y-auto">
            <div class="h-[64px] flex items-center px-[20px] text-white text-[16px] font-[600]">
                Dashboard
            </div>
            <nav class="flex-col p-[20px] space-y-2 text-[14px] font-[500]">
                <a href="#" class="block px-4 py-2 bg-[#4F46E5] text-white rounded-[12px]">Dashboard</a>
                <a href="#" class="block px-4 py-2 hover:bg-[#4F46E5] hover:text-white rounded-[12px]">Analytics</a>
                <a href="#" class="block px-4 py-2 hover:bg-[#4F46E5] hover:text-white rounded-[12px]">Settings</a>
            </nav>
        </aside>
        <div class="flex-1 flex flex-col min-w-0 h-screen overflow-y-auto">
            <header
                class="h-[64px] bg-[#FFFFFF] border-b border-[#E2E8F0] flex items-center px-4 md:px-[32px] justify-between sticky top-0 z-10 shrink-0">
                <button class="md:hidden text-[#0F172A]">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </button>
                <div class="hidden md:block"></div>
                <div class="text-[14px] font-[500] text-[#0F172A]">Admin</div>
            </header>
            <main class="p-4 md:p-[32px] flex flex-col gap-[24px]">
                <h1 class="text-[24px] font-[700] text-[#0F172A]">Dashboard</h1>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-[24px]">
                    <div
                        class="bg-[#FFFFFF] p-[20px] rounded-[12px] border border-[#E2E8F0] flex flex-col gap-2 justify-between">
                        <span class="text-[14px] font-[500] text-[#64748B]">Total Revenue</span>
                        <span class="text-[28px] font-[700] text-[#0F172A]">$45,231</span>
                        <span class="text-[14px] text-[#16A34A]">+20.1%</span>
                    </div>
                    <div
                        class="bg-[#FFFFFF] p-[20px] rounded-[12px] border border-[#E2E8F0] flex flex-col gap-2 justify-between">
                        <span class="text-[14px] font-[500] text-[#64748B]">Subscriptions</span>
                        <span class="text-[28px] font-[700] text-[#0F172A]">+2,350</span>
                        <span class="text-[14px] text-[#16A34A]">+180.1%</span>
                    </div>
                    <div
                        class="bg-[#FFFFFF] p-[20px] rounded-[12px] border border-[#E2E8F0] flex flex-col gap-2 justify-between">
                        <span class="text-[14px] font-[500] text-[#64748B]">Sales</span>
                        <span class="text-[28px] font-[700] text-[#0F172A]">+12,234</span>
                        <span class="text-[14px] text-[#16A34A]">+19%</span>
                    </div>
                    <div
                        class="bg-[#FFFFFF] p-[20px] rounded-[12px] border border-[#E2E8F0] flex flex-col gap-2 justify-between">
                        <span class="text-[14px] font-[500] text-[#64748B]">Active Now</span>
                        <span class="text-[28px] font-[700] text-[#0F172A]">+573</span>
                        <span class="text-[14px] text-[#16A34A]">+201 since last hour</span>
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-[2fr_1fr] gap-[24px]">
                    <div class="bg-[#FFFFFF] p-[20px] rounded-[12px] border border-[#E2E8F0] flex flex-col">
                        <h2 class="text-[16px] font-[600] text-[#0F172A] mb-4">Revenue Chart</h2>
                        <div class="h-64 bg-[#F1F5F9] rounded border border-[#E2E8F0]"></div>
                    </div>
                    <div
                        class="bg-[#FFFFFF] p-[20px] rounded-[12px] border border-[#E2E8F0] overflow-hidden flex flex-col">
                        <h2 class="text-[16px] font-[600] text-[#0F172A] mb-4">Recent Orders</h2>
                        <div class="overflow-x-auto w-full">
                            <table class="w-full text-left text-[14px]">
                                <thead>
                                    <tr class="border-b border-[#E2E8F0] text-[#0F172A]">
                                        <th class="py-2 px-2 font-[600]">Order</th>
                                        <th class="py-2 px-2 font-[600]">Status</th>
                                    </tr>
                                </thead>
                                <tbody class="text-[#64748B]">
                                    <tr class="border-b border-[#E2E8F0]">
                                        <td class="py-2 px-2">#1234</td>
                                        <td class="py-2 px-2 text-[#16A34A]">Paid</td>
                                    </tr>
                                    <tr class="border-b border-[#E2E8F0]">
                                        <td class="py-2 px-2">#1235</td>
                                        <td class="py-2 px-2 text-[#D97706]">Pending</td>
                                    </tr>
                                    <tr>
                                        <td class="py-2 px-2">#1236</td>
                                        <td class="py-2 px-2 text-[#DC2626]">Failed</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-[24px]">
                    <div class="bg-[#FFFFFF] p-[20px] rounded-[12px] border border-[#E2E8F0] flex flex-col">
                        <h2 class="text-[16px] font-[600] text-[#0F172A] mb-4">Traffic</h2>
                        <div class="h-64 bg-[#F1F5F9] rounded border border-[#E2E8F0]"></div>
                    </div>
                    <div class="bg-[#FFFFFF] p-[20px] rounded-[12px] border border-[#E2E8F0] flex flex-col">
                        <h2 class="text-[16px] font-[600] text-[#0F172A] mb-4">Top Products</h2>
                        <div class="h-64 bg-[#F1F5F9] rounded border border-[#E2E8F0]"></div>
                    </div>
                </div>
            </main>
        </div>
    </div>
</body>

</html>
